<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a1c3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fulkoli Sweets">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fulkoli Sweets</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf3e6;--sheet:#fffdf8;--ink:#2b1d14;--muted:#7a6a5c;--line:#e3d3bb;--accent:#8a1c3a;--accent-ink:#fff;--field:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--sheet:#261c16;--ink:#f3e8d8;--muted:#b4a28f;--line:#4a3a2e;--accent:#e08aa0;--accent-ink:#2b1020;--field:#31241c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1511;--sheet:#261c16;--ink:#f3e8d8;--muted:#b4a28f;--line:#4a3a2e;--accent:#e08aa0;--accent-ink:#2b1020;--field:#31241c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Anek Bangla","Noto Sans Bengali",system-ui,sans-serif;font-size:13px}
.wrap{max-width:760px;margin:0 auto;padding:14px}
#sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:18px 14px 12px}
h1{font-family:Lora,Georgia,serif;font-size:clamp(22px,6vw,30px);text-align:center;margin:4px 0 12px;color:var(--accent);letter-spacing:.5px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:2px solid var(--accent);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:12px}
select,input,textarea,button{font:inherit;font-size:13px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
select{font-weight:700;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.date{display:flex;align-items:center;gap:6px;color:var(--muted)}
.date input{width:150px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:rgba(128,128,128,.16);font-weight:600}
